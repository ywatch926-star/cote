name: LACRIMAE dev6 — Backblaze storage test

on:
  push:
    branches: [dev6]
    paths:
      - '.github/workflows/dev6_storage_test.yml'
      - 'tests/test_backblaze_storage.py'
      - 'SHARED/**'
  workflow_dispatch:
  repository_dispatch:
    types: [dev6-storage-test]

permissions:
  contents: read

jobs:
  storage-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STORAGE_S3_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      STORAGE_S3_REGION: us-east-005
      STORAGE_S3_BUCKET: lacrimae-video-dev
      STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
      STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout dev6
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install S3 client
        run: python -m pip install boto3==1.35.99 requests==2.32.3
      - name: Run isolated storage test
        run: python tests/test_backblaze_storage.py
